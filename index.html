<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      height: 620px;
      background: #1e293b;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Lock Screen / Password Gate */
    .gate-overlay {
      position: absolute;
      inset: 0;
      background: #1e293b;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .gate-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .gate-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .gate-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .gate-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .gate-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }
    .gate-input:focus {
      border-color: #3b82f6;
    }
    .gate-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.2s;
    }
    .gate-btn:hover {
      background: #2563eb;
    }
    .gate-error {
      color: #ef4444;
      font-size: 13px;
      min-height: 18px;
    }

    /* Chat UI */
    .header {
      padding: 16px;
      background: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #475569;
    }
    .status-dot {
      height: 10px;
      width: 10px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .room-badge {
      font-size: 12px;
      color: #94a3b8;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 12px;
    }
    .messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .message.sent {
      align-self: flex-end;
      background: #3b82f6;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .message.received {
      align-self: flex-start;
      background: #334155;
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
    }
    .sender-name {
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 3px;
    }
    .typing-bar {
      padding: 4px 16px;
      font-size: 12px;
      color: #94a3b8;
      font-style: italic;
      min-height: 22px;
    }
    .input-bar {
      display: flex;
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
      gap: 8px;
    }
    .msg-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      padding: 10px 14px;
      border-radius: 24px;
      outline: none;
      font-size: 14px;
    }
    .msg-input:focus {
      border-color: #3b82f6;
    }
    .send-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .send-btn:hover {
      background: #2563eb;
    }
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, query, orderBy, onSnapshot,
      serverTimestamp, doc, setDoc, deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // =========================================================================
    // 1. CONFIGURATION
    // =========================================================================
    // Shared passcode for you and your friend:
    const SECRET_PASSWORD = "2069";

    const firebaseConfig = {
      apiKey: "AIzaSyC5FzCvnz3918GpyOWko3ZDI1jXwZnU1i0",
      authDomain: "newspace-sp01.firebaseapp.com",
      projectId: "newspace-sp01",
      storageBucket: "newspace-sp01.firebasestorage.app",
      messagingSenderId: "1013425614979",
      appId: "1:1013425614979:web:562e01f11705baa6f46bb6",
      measurementId: "G-H3F2PH6X99"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Cryptographic room isolation derived from the password
    let roomId = "room-default";
    let currentUser = null;
    let currentUserName = "";

    const gateOverlay = document.getElementById("gate-overlay");
    const nameInput = document.getElementById("name-input");
    const passInput = document.getElementById("pass-input");
    const gateError = document.getElementById("gate-error");

    const userDisplay = document.getElementById("user-display");
    const messagesContainer = document.getElementById("messages");
    const typingIndicator = document.getElementById("typing-indicator");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    let typingTimeout = null;

    // Check existing session
    const sessionAuth = sessionStorage.getItem("chat_authorized");
    const sessionUser = sessionStorage.getItem("chat_display_name");
    const sessionRoom = sessionStorage.getItem("chat_room_id");
    if (sessionAuth === "true" && sessionUser && sessionRoom) {
      currentUserName = sessionUser;
      roomId = sessionRoom;
      gateOverlay.style.display = "none";
      connectFirebase();
    }

    async function computeRoomHash(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode("chat_room_salt_" + password);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return "room_" + hashArray.map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
    }

    // Handle password login
    window.handleLogin = async function (e) {
      e.preventDefault();
      const enteredName = nameInput.value.trim().slice(0, 40);
      const enteredPass = passInput.value.trim();

      if (!enteredName) {
        gateError.textContent = "Please enter your name.";
        return;
      }

      if (enteredPass !== SECRET_PASSWORD) {
        gateError.textContent = "Incorrect password! Please try again.";
        return;
      }

      gateError.textContent = "";
      currentUserName = enteredName;
      roomId = await computeRoomHash(enteredPass);

      sessionStorage.setItem("chat_authorized", "true");
      sessionStorage.setItem("chat_display_name", currentUserName);
      sessionStorage.setItem("chat_room_id", roomId);

      gateOverlay.style.display = "none";
      connectFirebase();
    };

    function connectFirebase() {
      userDisplay.textContent = `Connecting as: ${currentUserName}...`;
      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          userDisplay.textContent = `Logged in: ${currentUserName}`;
          sendBtn.disabled = false;
          initChat();
        } else {
          signInAnonymously(auth).catch((err) => {
            userDisplay.textContent = "Auth connection error";
            console.error("Authentication error:", err);
          });
        }
      });
    }

    function initChat() {
      const messagesCol = collection(db, "rooms", roomId, "messages");
      const typingCol = collection(db, "rooms", roomId, "typing");
      const myTypingRef = doc(db, "rooms", roomId, "typing", currentUser.uid);

      // Listen for messages in real time
      const q = query(messagesCol, orderBy("timestamp", "asc"));
      onSnapshot(q, (snapshot) => {
        messagesContainer.innerHTML = "";
        if (snapshot.empty) {
          const emptyNotice = document.createElement("div");
          emptyNotice.style.textAlign = "center";
          emptyNotice.style.color = "#64748b";
          emptyNotice.style.fontSize = "13px";
          emptyNotice.textContent = "No messages yet. Say hello!";
          messagesContainer.appendChild(emptyNotice);
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const isMe = data.senderId === currentUser.uid;

          const msgEl = document.createElement("div");
          msgEl.className = `message ${isMe ? "sent" : "received"}`;

          const senderEl = document.createElement("div");
          senderEl.className = "sender-name";
          senderEl.textContent = data.senderName || "Friend";

          const textEl = document.createElement("div");
          textEl.textContent = data.text || "";

          msgEl.appendChild(senderEl);
          msgEl.appendChild(textEl);
          messagesContainer.appendChild(msgEl);
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });

      // Listen for typing indicator
      onSnapshot(typingCol, (snapshot) => {
        const typers = [];
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if (docSnap.id !== currentUser.uid && data.typing) {
            typers.push(data.user || "Someone");
          }
        });

        if (typers.length > 0) {
          typingIndicator.textContent = `${typers.join(", ")} is typing...`;
        } else {
          typingIndicator.textContent = "";
        }
      });

      // Emit typing status with debounce
      messageInput.addEventListener("input", async () => {
        if (!currentUser) return;
        await setDoc(myTypingRef, { typing: true, user: currentUserName, updatedAt: Date.now() });

        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(async () => {
          await deleteDoc(myTypingRef);
        }, 2500);
      });

      // Send Message
      window.sendMessage = async function () {
        const text = messageInput.value.trim();
        if (!text || !currentUser || text.length > 2000) return;

        clearTimeout(typingTimeout);
        deleteDoc(myTypingRef).catch(() => {});

        try {
          await addDoc(messagesCol, {
            senderId: currentUser.uid,
            senderName: currentUserName,
            text: text,
            timestamp: serverTimestamp()
          });
          messageInput.value = "";
        } catch (err) {
          console.error("Failed to send message:", err);
        }
      };
    }
  </script>
</head>
<body>
  <div class="card">
    <!-- Password / Name Gate Overlay -->
    <div class="gate-overlay" id="gate-overlay">
      <div class="gate-icon">🔒</div>
      <div class="gate-title">Private Chat</div>
      <div class="gate-subtitle">Enter your name and the shared password to enter the room</div>
      <form class="gate-form" onsubmit="handleLogin(event)">
        <input type="text" id="name-input" class="gate-input" placeholder="Your name (e.g., Alex)" maxlength="40" required autocomplete="off" />
        <input type="password" id="pass-input" class="gate-input" placeholder="Secret password" required />
        <div class="gate-error" id="gate-error"></div>
        <button type="submit" class="gate-btn">Enter Chat</button>
      </form>
    </div>

    <!-- Main Chat Screen -->
    <div class="header">
      <div>
        <span class="status-dot"></span>
        <strong id="user-display">Connecting...</strong>
      </div>
      <span class="room-badge">🔒 Protected Room</span>
    </div>

    <div class="messages-container" id="messages">
      <div style="text-align: center; color: #64748b; font-size: 13px;">Connecting to chat...</div>
    </div>

    <div class="typing-bar" id="typing-indicator"></div>

    <form class="input-bar" onsubmit="event.preventDefault(); sendMessage();">
      <input type="text" id="message-input" class="msg-input" placeholder="Type a message..." autocomplete="off" maxlength="2000" />
      <button type="submit" id="send-btn" class="send-btn" disabled>Send</button>
    </form>
  </div>
</body>
</html>
